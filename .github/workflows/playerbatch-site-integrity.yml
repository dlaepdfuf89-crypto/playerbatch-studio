name: PlayerBatch sales-site integrity
on:
  push:
    paths:
      - "index.html"
      - "sample-output-pack.html"
      - "sample_roster_20.csv"
      - "assets/**"
      - "downloads/**"
      - "tools/playerbatch_site_integrity.py"
      - ".github/workflows/playerbatch-site-integrity.yml"
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current public site files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify trial ZIP and public page references
        run: python tools/playerbatch_site_integrity.py
